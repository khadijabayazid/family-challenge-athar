<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تحدّي العائلات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark olive stage with concentric rings echoing the project mark; host console (main + family sidebar), editor, settings, and a one-screen projector board. */
:root{
  color-scheme:dark;
  --bg:#131a06; --panel:#1d2709; --panel2:#26330d; --line:#3a4a17;
  --olive:#788c19; --lime:#b6d233; --paper:#f3f6e6; --mute:#a5b27f; --ink:#172004;
  --fam1:#f5b82e; --fam2:#4cc3f0; --fam3:#ff7b8c;
  --bad:#ff5545; --ok:#8be04e;
  --f-display:"Reem Kufi","Noto Kufi Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;margin:0}
#app{position:relative;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
#app.is-display{height:100%;padding-block:12px}
#app::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(70vmax 70vmax at 84% 10%,rgba(120,140,25,.30),transparent 62%),
  repeating-radial-gradient(circle at 84% 10%,transparent 0 6.5vmax,rgba(182,210,51,.07) 6.5vmax calc(6.5vmax + 2px))}
#app>*{position:relative;z-index:1}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:1.1em;height:1.1em;flex:none}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;border-radius:9px;display:block;flex:none}
.bt{font:700 1.25rem/1.2 var(--f-display)}
.bs{font-size:.8rem;color:var(--mute)}
.tabs{display:flex;gap:4px;margin-inline-start:auto}
.tabs button{background:none;border:0;color:var(--mute);font:600 .95rem var(--f-body);padding:.5rem .9rem;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--paper);border-bottom-color:var(--lime)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .95rem var(--f-body);border:1px solid var(--line);background:var(--panel2);color:var(--paper);padding:.55rem 1rem;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--olive)}
.btn.primary{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:.3rem .6rem;font-size:.82rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}

/* host */
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.main{display:grid;gap:16px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--mute);font:600 .85rem var(--f-body);padding:.3rem .7rem;border-radius:6px;cursor:pointer;display:inline-flex;gap:.4rem;align-items:center}
.chip.on{background:var(--olive);border-color:var(--lime);color:#fff}
.chip.played{color:var(--paper)}
.chip b{color:var(--lime);font-family:var(--f-display)}
.qbox{background:var(--panel);border:1px solid var(--line);padding:16px 18px;border-radius:6px}
.qbox small{color:var(--mute);font-size:.8rem;display:flex;gap:10px}
.qbox h2{margin:.25rem 0 0;font:700 1.6rem/1.45 var(--f-display);text-wrap:balance}
.ph{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;gap:10px}
.ph h3{margin:0;font:700 1.15rem var(--f-display)}
.ph p{margin:0;color:var(--mute);font-size:.92rem;max-width:70ch}
.fbtns{display:flex;flex-wrap:wrap;gap:8px}
.fbtn{background:var(--panel);border:1px solid var(--c);color:var(--paper);font:600 .95rem var(--f-body);padding:.55rem 1rem;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem}
.fbtn i{width:.7rem;height:.7rem;border-radius:50%;background:var(--c);display:block}
.fbtn:hover{background:var(--c);color:var(--ink)}
.fbtn:hover i{background:var(--ink)}
.fbtn.sug{background:var(--c);color:var(--ink)}
.fbtn.sug i{background:var(--ink)}
.dots{display:flex;gap:6px}
.dots i{width:1.6rem;height:1.6rem;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;color:transparent}
.dots i.hit{background:var(--bad);border-color:var(--bad);color:#fff}
.alist{display:grid;gap:6px}
.arow{display:grid;grid-template-columns:2rem minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:.65rem .9rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--paper);font:500 1rem var(--f-body);cursor:pointer;text-align:start;width:100%}
.arow:hover:not(:disabled){border-color:var(--lime)}
.arow .n{font:700 1.1rem var(--f-display);color:var(--lime)}
.arow .p{font:700 1.05rem var(--f-display);font-variant-numeric:tabular-nums}
.arow .s{font-size:.78rem;color:var(--mute);min-width:3.2rem;text-align:end}
.arow[data-on]{background:var(--olive);border-color:var(--olive);color:#fff}
.arow[data-on] .s,.arow[data-on] .n{color:#fff}
.arow:disabled{opacity:.55;cursor:not-allowed}
.bankline{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.bankline .v{font:700 1.4rem var(--f-display);font-variant-numeric:tabular-nums}
.bankline span{color:var(--mute);font-size:.9rem}
.hint{font-size:.8rem;color:var(--mute)}
.side{display:grid;gap:10px}
.fam{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);padding:12px 14px;border-radius:4px 4px 6px 6px;display:grid;gap:4px}
.fam.ctl{background:var(--panel2);box-shadow:0 0 0 1px var(--c)}
.fam-name{font-weight:600}
.fam-score{font:700 2.4rem/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--c)}
.fam-tag{font-size:.78rem;color:var(--mute);min-height:1.2em}
.fam-adj{display:flex;gap:6px}
.pulse .fam-score,.pulse.tile b{animation:pulse .9s}
@keyframes pulse{40%{transform:scale(1.18)}}


.arow[data-on]{border-inline-start:6px solid var(--c,var(--lime))}
.arow.miss[data-on]{background:transparent;border-style:dashed;color:var(--mute)}
.arow.miss[data-on] .n,.arow.miss[data-on] .s{color:var(--mute)}
.arow:disabled:not([data-on]){opacity:.7}
.card.on.miss{background:transparent;border:2px dashed var(--line);color:var(--mute)}
.card.on.miss .cn{background:transparent;color:var(--mute)}
.card.on.miss .cp{background:transparent;color:var(--mute)}
.fstates{display:flex;flex-wrap:wrap;gap:8px}
.fs{display:inline-flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:.2rem .6rem}
.fs i{width:.6rem;height:.6rem;border-radius:50%;background:var(--c)}
.fs.now{color:var(--paper);border-color:var(--c)}
.fs.out{color:var(--bad);border-color:var(--bad)}
.tile .tg svg{vertical-align:-.15em}
.tile.struck .tg{color:var(--bad)}
.tile.struck{opacity:.9}


.card.on .ct{align-self:center}
.arow[data-on]:disabled{opacity:1}
.arow.miss[data-on]:disabled{opacity:.7;border-inline-start-color:var(--line)}

/* editor / settings */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;gap:14px;min-width:0}
.panel h2{margin:0;font:700 1.2rem var(--f-display)}
.egrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.qlist{display:grid;gap:6px}
.qitem{display:grid;grid-template-columns:1.6rem minmax(0,1fr) auto;gap:8px;align-items:center;text-align:start;background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:.55rem .7rem;border-radius:6px;cursor:pointer;font:500 .9rem var(--f-body)}
.qitem.on{border-color:var(--lime);background:var(--panel2)}
.qitem .qn{font:700 1rem var(--f-display);color:var(--lime)}
.qitem .qt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .qm{font:700 .85rem var(--f-display);color:var(--mute)}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
input[type=text],input[type=number],textarea,select{background:var(--bg);border:1px solid var(--line);color:var(--paper);font:500 1rem var(--f-body);padding:.5rem .7rem;border-radius:6px;width:100%;min-width:0}
textarea{min-height:5.5rem;resize:vertical;line-height:1.5}
.erow{display:grid;grid-template-columns:1.6rem minmax(0,1fr) 5.5rem auto;gap:8px;align-items:center}
.erow .n{font:700 1rem var(--f-display);color:var(--lime)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.warn{color:#ffc857;font-size:.85rem}
.ok{color:var(--ok);font-size:.85rem}
.rules{margin:0;padding-inline-start:1.2rem;display:grid;gap:6px;color:var(--paper);font-size:.95rem;max-width:75ch}
.rules b{color:var(--lime)}
code.k{background:var(--bg);border:1px solid var(--line);padding:.05rem .4rem;border-radius:4px;font-size:.85em;direction:ltr;display:inline-block}

/* display board */
.board{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:clamp(8px,1.8vh,18px)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dh .logo{width:clamp(38px,6vh,60px);height:clamp(38px,6vh,60px)}
.dh .bt{font-size:clamp(1rem,3vh,1.7rem)}
.rnd{font:600 clamp(.9rem,2.6vh,1.4rem) var(--f-display);color:var(--mute);display:flex;gap:10px;align-items:center}
.rnd b{background:var(--lime);color:var(--ink);padding:.05em .55em;border-radius:5px}
.mid{display:flex;align-items:stretch;gap:clamp(8px,1.4vw,16px)}
.qbar{flex:1;min-width:0;background:var(--paper);color:var(--ink);font:700 clamp(1.1rem,min(3vw,5vh),2.6rem)/1.4 var(--f-display);padding:.5em .9em;border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;text-wrap:balance;border-bottom:6px solid var(--lime)}
.qbar.waiting{background:transparent;color:var(--paper);border:2px dashed var(--line);flex-direction:column;gap:.1em}
.qbar.waiting em{font:500 .6em var(--f-body);font-style:normal;color:var(--mute)}
.bankbox{background:var(--bg);border:2px solid var(--lime);border-radius:6px;padding:.3em 1em;display:grid;place-items:center;min-width:clamp(90px,12vw,170px)}
.bankbox span{font-size:clamp(.7rem,1.8vh,.95rem);color:var(--mute)}
.bankbox b{font:700 clamp(1.5rem,min(4vw,7vh),3.6rem)/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--lime)}
.cards{display:grid;grid-auto-flow:column;gap:clamp(6px,1.2vh,12px) clamp(8px,1.4vw,16px);min-height:0}
.card{background:linear-gradient(180deg,#5f7413,#475a0f);border:1px solid #7e9822;border-radius:6px;display:grid;place-items:center;min-height:0;overflow:hidden}
.card .cnum{width:2em;height:2em;border-radius:50%;background:var(--bg);color:var(--lime);display:grid;place-items:center;font:700 clamp(1rem,min(2.6vw,4.4vh),2.2rem) var(--f-display)}
.card.on{background:var(--paper);border-color:var(--paper);color:var(--ink);display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:.6em;align-items:center;place-items:unset;padding:0 .6em 0 0;font:700 clamp(1rem,min(2.6vw,4.4vh),2.2rem) var(--f-display)}
.card.on .cn{background:var(--ink);color:var(--lime);height:100%;display:grid;place-items:center;font-size:.8em}
.card.on .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.on .cp{background:var(--c,var(--lime));height:100%;min-width:2.4em;padding:0 .6em;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-right:-.6em}
.card.fresh{animation:flip .55s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:rotateX(90deg);opacity:.2}to{transform:none;opacity:1}}
.status{text-align:center;font:600 clamp(.9rem,2.6vh,1.35rem) var(--f-display);min-height:1.5em;color:var(--lime)}
.strikes{display:flex;justify-content:center;gap:8px}
.strikes i{width:clamp(30px,5vh,48px);height:clamp(30px,5vh,48px);border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;color:transparent}
.strikes i.hit{background:var(--bad);border-color:var(--bad);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1.2vw,14px)}
.tile{background:var(--panel);border:1px solid var(--line);border-top:clamp(4px,.8vh,8px) solid var(--c);padding:.4em .8em;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.5em;border-radius:4px 4px 6px 6px}
.tile.ctl{background:var(--panel2);box-shadow:0 0 0 2px var(--c)}
.tile .nm{font:600 clamp(.85rem,2.3vh,1.3rem) var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tg{grid-column:1/-1;font-size:clamp(.7rem,1.7vh,.9rem);color:var(--c);min-height:1.2em;order:3}
.tile b{font:700 clamp(1.5rem,min(4vw,6.5vh),3.4rem)/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--c)}
.steal .tg{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.dock{position:fixed;inset-inline-start:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;opacity:.25;transition:opacity .2s;z-index:20}
.dock:hover,.dock:focus-within{opacity:1}
.fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:2vw;pointer-events:none;z-index:50;animation:fxo 1.3s forwards;background:rgba(255,85,69,.12)}
.fx svg{width:min(26vw,40vh);height:min(26vw,40vh);color:var(--bad);filter:drop-shadow(0 0 24px rgba(255,85,69,.7));stroke-width:3.2}
@keyframes fxo{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

/* final */
.final{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:16px;text-align:center}
.final h1{margin:0;font:700 clamp(1.6rem,6vh,3.4rem)/1.3 var(--f-display);text-wrap:balance}
.final h1 em{font-style:normal;color:var(--lime)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,24px);align-items:end;min-height:0}
.pod{background:var(--panel2);border:1px solid var(--line);border-top:8px solid var(--c);display:grid;align-content:start;justify-items:center;padding:.8em .4em;gap:.2em;border-radius:6px 6px 0 0}
.pod.win{background:var(--c);color:var(--ink)}
.pod .rk{font:700 clamp(1.2rem,4vh,2.4rem) var(--f-display)}
.pod .nm{font:600 clamp(.9rem,2.6vh,1.5rem) var(--f-display)}
.pod b{font:700 clamp(1.8rem,7vh,4.2rem)/1 var(--f-display);font-variant-numeric:tabular-nums}

@media (max-width:980px){
  .hgrid,.egrid{grid-template-columns:minmax(0,1fr)}
  .side{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tabs{margin-inline-start:0;order:3;width:100%}
}
@media (max-width:640px){
  .side{grid-template-columns:minmax(0,1fr)}
  .cards{grid-auto-flow:row!important;grid-template-rows:none!important}
  #app.is-display{height:auto;min-height:100%}
  .board{height:auto}
  .card{min-height:3.2rem}
  .mid{flex-direction:column}
  .erow{grid-template-columns:1.4rem minmax(0,1fr) 4.5rem auto}
  .fam-score{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

</head>

function clone(o){return JSON.parse(JSON.stringify(o))}
function resetRound(s){s.phase='ready';s.turn=null;s.struck=[false,false,false];s.revealed=[];s.owner={};s.missed=[];s.rp=[0,0,0]}
function fresh(){
  const s={rev:1,title:'تحدّي العائلات',sub:'أسئلة تفاعلية لطلاب الهندسة المعلوماتية',
    families:[{name:'العائلة الأولى',score:0},{name:'العائلة الثانية',score:0},{name:'العائلة الثالثة',score:0}],
    questions:clone(DEFAULT_Q),round:0,fx:{id:0,kind:'',n:0}};
  resetRound(s);return s;
}
function setFx(s,kind,n){s.fx={id:((s.fx&&s.fx.id)||0)+1,kind:kind,n:n||0}}
function snap(s){const o={scores:s.families.map(f=>f.score)};GF.forEach(k=>{o[k]=clone(s[k])});return o}
function restore(s,o){s.families.forEach((f,i)=>{f.score=o.scores[i]});GF.forEach(k=>{s[k]=clone(o[k])})}
function nextTurn(s){for(let d=1;d<=2;d++){const j=(s.turn+d)%3;if(!s.struck[j])return j}return null}
function finish(s){s.phase='done';s.turn=null}
const ACT={
  start(s,i){if(s.phase!=='ready')return;s.phase='play';s.turn=i},
  reveal(s,k){
    const q=s.questions[s.round];
    if(s.phase!=='play'||!q||!q.answers[k]||s.revealed.indexOf(k)>-1)return;
    const pts=(+q.answers[k].p||0)*q.mult;
    s.revealed.push(k);s.owner[k]=s.turn;
    s.families[s.turn].score+=pts;s.rp[s.turn]+=pts;setFx(s,'correct');
    if(s.revealed.length>=q.answers.length){finish(s);setFx(s,'award')}
  },
  wrong(s){
    if(s.phase!=='play')return;
    s.struck[s.turn]=true;setFx(s,'strike',1);
    const n=nextTurn(s);if(n==null)finish(s);else s.turn=n;
  },
  endRound(s){if(s.phase==='play')finish(s)},
  revealRest(s){
    if(s.phase!=='done')return;
    const q=s.questions[s.round];let any=false;
    q.answers.forEach((a,k)=>{if(s.revealed.indexOf(k)<0){s.revealed.push(k);s.missed.push(k);any=true}});
    if(any)setFx(s,'reveal');
  },
  next(s){
    if(s.phase!=='done')return;
    if(s.round+1>=s.questions.length){s.phase='final'}else{s.round++;resetRound(s)}
    setFx(s,'next');
  },
  jump(s,r){if(['ready','done','final'].indexOf(s.phase)<0)return;if(r<0||r>=s.questions.length)return;s.round=r;resetRound(s)},
  adj(s,i,d){s.families[i].score+=d},
  resetGame(s){s.families.forEach(f=>{f.score=0});s.round=0;resetRound(s);setFx(s,'next')}
};

/* ---------- actions ---------- */
function commit(fn){
  const before=snap(S),bj=JSON.stringify(before),f0=S.fx.id;
  fn(S);
  if(JSON.stringify(snap(S))===bj&&S.fx.id===f0)return;
  HIST.push(before);if(HIST.length>40)HIST.shift();
  S.rev++;save();broadcast();render();
  if(S.fx.id!==lastFx){lastFx=S.fx.id;showFx(S.fx,true)}
}
function undo(){
  if(!HIST.length)return;
  restore(S,HIST.pop());S.rev++;save();broadcast();render();
}
function touch(){
  if(S.round>=S.questions.length)S.round=S.questions.length-1;
  const q=Q();S.revealed=S.revealed.filter(k=>k<q.answers.length);
  S.rev++;save();broadcast();
}

/* ---------- sound & fx ---------- */
let AC=null;
function beep(f,t0,d,type,g){
  const o=AC.createOscillator(),v=AC.createGain();
  o.type=type;o.frequency.value=f;o.connect(v);v.connect(AC.destination);
  const t=AC.currentTime+t0;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.start(t);o.stop(t+d+.02);
}
function snd(kind){
  if(!SOUND)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(kind==='correct'){beep(660,0,.18,'sine',.2);beep(990,.12,.3,'sine',.2)}
    else if(kind==='strike'){beep(150,0,.55,'sawtooth',.22);beep(110,.05,.5,'square',.1)}
    else if(kind==='award'){[523,659,784,1047].forEach((f,i)=>beep(f,i*.11,.35,'triangle',.2))}
  }catch(e){}
}
function showFx(fx,local){
  if(local)snd(fx.kind);
  if(fx.kind==='strike'&&view==='display'){
    const d=document.createElement('div');d.className='fx';
    d.innerHTML=Array.from({length:fx.n||1}).map(()=>ico('x')).join('');
    document.body.appendChild(d);setTimeout(()=>d.remove(),1400);
  }
}

  const list=S.questions.map((x,i)=>'<button class="qitem '+(i===EQ?'on':'')+'" data-a="eq" data-i="'+i+'"><span class="qn">'+(i+1)+'</span><span class="qt">'+esc(x.text||'سؤال بلا نص')+'</span><span class="qm">×'+x.mult+'</span></button>').join('');
  const ans=q.answers.map((a,k)=>'<div class="erow"><span class="n">'+(k+1)+'</span><input type="text" id="at'+k+'" data-in="at" data-k="'+k+'" value="'+esc(a.t)+'" placeholder="نص الإجابة" aria-label="الإجابة '+(k+1)+'"><input type="number" id="ap'+k+'" data-in="ap" data-k="'+k+'" value="'+a.p+'" min="0" max="999" aria-label="نقاط الإجابة '+(k+1)+'"><button class="btn sm ghost" data-a="adel" data-k="'+k+'" aria-label="حذف الإجابة">'+ico('trash')+'</button></div>').join('');
  const json=JSON.stringify(S.questions,null,1);
  return '<div class="egrid"><div class="panel"><h2>الأسئلة ('+S.questions.length+')</h2><div class="qlist">'+list+'</div><button class="btn" data-a="qadd">'+ico('plus')+'سؤال جديد</button></div>'+
   '<div style="display:grid;gap:16px;min-width:0"><div class="panel"><h2>السؤال '+(EQ+1)+'</h2>'+
   '<label class="f" for="qtext">نص السؤال<textarea id="qtext" data-in="qtext">'+esc(q.text)+'</textarea></label>'+
   '<label class="f" for="qmult" style="max-width:16rem">مضاعف النقاط<select id="qmult" data-in="qmult">'+[1,2,3].map(m=>'<option value="'+m+'"'+(q.mult===m?' selected':'')+'>×'+m+(m===1?' (عادي)':'')+'</option>').join('')+'</select></label>'+
   '<div style="display:grid;gap:8px"><div class="row" style="justify-content:space-between"><b>الإجابات والنقاط</b><span id="tot" class="'+(q.answers.length<3||q.answers.length>8?'warn':'hint')+'">'+etxt(q,tot)+'</span></div>'+ans+
   '<div class="row"><button class="btn" data-a="aadd"'+(q.answers.length>=8?' disabled':'')+'>'+ico('plus')+'إجابة</button><button class="btn ghost" data-a="asort">'+ico('sort')+'رتّب حسب النقاط</button></div></div>'+
   '<div class="row" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn ghost" data-a="qup"'+(EQ===0?' disabled':'')+'>'+ico('up')+'أعلى</button><button class="btn ghost" data-a="qdown"'+(EQ===S.questions.length-1?' disabled':'')+'>'+ico('down')+'أسفل</button><button class="btn ghost" data-a="qdup">'+ico('copy')+'نسخ السؤال</button>'+
   '<button class="btn ghost '+(ARM==='qdel'?'armed':'')+'" data-a="qdel"'+(S.questions.length<2?' disabled':'')+'>'+ico('trash')+(ARM==='qdel'?'اضغط للتأكيد':'حذف السؤال')+'</button></div></div>'+
   '<div class="panel"><h2>نسخ احتياطي واستيراد</h2><p class="hint" style="margin:0">انسخ النص لحفظ الأسئلة في ملف، أو الصق نصاً محفوظاً ثم اضغط استيراد. الاستيراد يستبدل كل الأسئلة ولا يغيّر النقاط.</p><textarea id="io" style="min-height:8rem;direction:ltr;font-family:ui-monospace,monospace;font-size:.8rem">'+esc(json)+'</textarea><div class="row"><button class="btn" data-a="exp">'+ico('copy')+'نسخ</button><button class="btn" data-a="imp">استيراد من النص</button><span id="iomsg" class="hint">'+esc(IOMSG)+'</span></div></div></div></div>';
}
function etxt(q,tot){return q.answers.length+' إجابات · مجموع النقاط '+tot+(q.answers.length<3?' · أضف إجابات (3 على الأقل)':q.answers.length>8?' · الحد الأقصى 8':'')}
function settingsView(){
  return '<div style="display:grid;gap:16px;max-width:760px"><div class="panel"><h2>الهوية والعائلات</h2>'+
   '<label class="f" for="stitle">عنوان الفعالية<input type="text" id="stitle" data-in="title" value="'+esc(S.title)+'"></label>'+
   '<label class="f" for="ssub">العنوان الفرعي<input type="text" id="ssub" data-in="sub" value="'+esc(S.sub)+'"></label>'+
   S.families.map((f,i)=>'<label class="f" for="sf'+i+'" style="--c:'+FAM[i]+'">اسم العائلة '+(i+1)+'<input type="text" id="sf'+i+'" data-in="fam" data-i="'+i+'" value="'+esc(f.name)+'" style="border-inline-start:6px solid '+FAM[i]+'"></label>').join('')+
   '<label class="row" style="gap:10px"><input type="checkbox" id="ssnd" data-in="snd"'+(SOUND?' checked':'')+' style="width:auto"> المؤثرات الصوتية</label></div>'+
   '<div class="panel"><h2>شاشة العرض على جهاز ثانٍ</h2><p class="hint" style="margin:0">الزر «شاشة العرض» يملأ هذه النافذة باللوحة. لعرض اللوحة على الشاشة الكبيرة وإبقاء لوحة التحكم أمامك: افتح رابط الفعالية نفسه في نافذة ثانية وأضف <code class="k">#display</code> في آخره، وانقلها إلى شاشة العرض واضغط <code class="k">F</code> لملء الشاشة. النافذتان تتزامنان تلقائياً داخل المتصفح نفسه على الجهاز نفسه.</p></div>'+
   '<div class="panel"><h2>قواعد اللعب بثلاث عائلات</h2><ol class="rules">'+
   '<li><b>البداية:</b> يختار المقدّم العائلة التي تبدأ، ويتبدّل المقترح بين العائلات من جولة لأخرى.</li>'+
   '<li><b>الإجابة:</b> تجيب العائلة التي عليها الدور. كل إجابة صحيحة تُكشف وتُضاف نقاطها مباشرة إلى رصيد هذه العائلة، ولا تُؤخذ منها.</li>'+
   '<li><b>الخطأ:</b> لكل عائلة خطأ واحد في الجولة. عند الخطأ يظهر لها X وينتقل الدور إلى العائلة التالية التي لم تخطئ بعد.</li>'+
   '<li><b>نهاية الجولة:</b> تنتهي عندما تخطئ العائلات الثلاث، أو عندما تُكشف كل الإجابات، أو بزر «إنهاء الجولة الآن».</li>'+
   '<li><b>الإجابات المتبقية:</b> بعد انتهاء الجولة يكشف المقدّم الإجابات التي لم تذكرها أي عائلة، وتظهر باهتة بلا نقاط لأحد.</li>'+
   '<li><b>المضاعفة:</b> في الجولة ذات مضاعف ×2 أو ×3 تُضرب نقاط كل إجابة صحيحة.</li>'+
   '<li><b>النهاية:</b> تفوز العائلة الأعلى نقاطاً، وتظهر رسالة تعادل عند تساوي القمة.</li></ol></div>'+
   '<div class="panel"><h2>لعبة جديدة</h2><p class="hint" style="margin:0">يصفّر نقاط العائلات ويعود إلى الجولة الأولى. الأسئلة والأسماء تبقى كما هي.</p><div><button class="btn '+(ARM==='reset'?'armed':'')+'" data-a="reset">'+(ARM==='reset'?'اضغط مرة أخرى للتأكيد':'تصفير اللعبة')+'</button></div></div></div>';
}
function render(){
  $app.className=view==='display'?'is-display':'';
  let h;
  if(view==='display')h=displayView();
  else h=topbar()+(view==='host'?hostView():view==='editor'?editorView():settingsView());
  $app.innerHTML=h;
  PR={round:S.round,list:S.revealed.slice()};PS=S.families.map(f=>f.score);
}
function arm(k){ARM=k;render();setTimeout(()=>{if(ARM===k){ARM=null;if(view==='editor'||view==='settings')render()}},4000)}
function toggleFs(){
  try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
}

/* ---------- events ---------- */
$app.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  const a=t.dataset.a,i=+t.dataset.i,k=+t.dataset.k,q=S.questions[EQ];
  switch(a){
  case 'view':view=t.dataset.v;render();break;
  case 'display':view='display';render();break;
  case 'back':view='host';render();break;
  case 'undo':undo();break;
  case 'fs':toggleFs();break;
  case 'start':commit(s=>ACT.start(s,i));break;
  case 'reveal':commit(s=>ACT.reveal(s,k));break;
  case 'wrong':commit(ACT.wrong);break;
  case 'endRound':commit(ACT.endRound);break;
  case 'revealRest':commit(ACT.revealRest);break;
  case 'next':commit(ACT.next);break;
  case 'jump':commit(s=>ACT.jump(s,i));break;
  case 'adj':commit(s=>ACT.adj(s,i,+t.dataset.d));break;
  case 'reset':if(ARM==='reset'){ARM=null;HIST=[];commit(ACT.resetGame);view='host';render()}else arm('reset');break;
  case 'eq':EQ=i;render();break;
  case 'qadd':S.questions.push({text:'سؤال جديد',mult:1,answers:[{t:'',p:0},{t:'',p:0},{t:'',p:0}]});EQ=S.questions.length-1;touch();render();break;
  case 'qdup':S.questions.splice(EQ+1,0,JSON.parse(JSON.stringify(q)));if(S.round>EQ)S.round++;EQ++;touch();render();break;
  case 'qdel':
    if(ARM==='qdel'){ARM=null;S.questions.splice(EQ,1);
      if(S.round===EQ){resetRound(S)}else if(S.round>EQ)S.round--;
      if(EQ>=S.questions.length)EQ=S.questions.length-1;touch();render()}
    else arm('qdel');break;
  case 'qup':case 'qdown':{
    const j=a==='qup'?EQ-1:EQ+1;if(j<0||j>=S.questions.length)break;
    const tmp=S.questions[EQ];S.questions[EQ]=S.questions[j];S.questions[j]=tmp;
    if(S.round===EQ)S.round=j;else if(S.round===j)S.round=EQ;
    EQ=j;touch();render();break}
  case 'aadd':if(q.answers.length<8){q.answers.push({t:'',p:0});touch();render()}break;
  case 'adel':q.answers.splice(k,1);touch();render();break;
  case 'asort':q.answers.sort((x,y)=>(+y.p||0)-(+x.p||0));S.revealed=[];touch();render();break;
  case 'exp':{
    const ta=document.getElementById('io');
    ta.select();
    try{navigator.clipboard.writeText(ta.value).then(()=>setMsg('تم النسخ'),()=>setMsg('حدّد النص وانسخه يدوياً'))}catch(err){setMsg('حدّد النص وانسخه يدوياً')}
    break}
  case 'imp':{
    const ta=document.getElementById('io');
    try{
      const arr=JSON.parse(ta.value);
      if(!Array.isArray(arr)||!arr.length)throw 0;
      const out=arr.map(x=>{
        if(!x||typeof x.text!=='string'||!Array.isArray(x.answers)||!x.answers.length)throw 0;
        return {text:x.text,mult:[1,2,3].indexOf(+x.mult)>-1?+x.mult:1,
          answers:x.answers.slice(0,8).map(r=>({t:String(r.t==null?'':r.t),p:Math.max(0,Math.min(999,Math.round(+r.p||0)))}))};
      });
      S.questions=out;S.round=0;resetRound(S);EQ=0;HIST=[];touch();IOMSG='تم استيراد '+out.length+' سؤال';render();
    }catch(err){setMsg('النص غير صالح. تأكد من أنه بالصيغة التي نُسخت منها.')}
    break}
  }
});
function setMsg(m){IOMSG=m;const el=document.getElementById('iomsg');if(el)el.textContent=m}
$app.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.in;if(!k)return;
  const q=S.questions[EQ];
  if(k==='title')S.title=t.value;
  else if(k==='sub')S.sub=t.value;
  else if(k==='fam')S.families[+t.dataset.i].name=t.value;
  else if(k==='snd'){SOUND=t.checked;try{localStorage.setItem(KEY+'-snd',SOUND?'1':'0')}catch(_){}return}
  else if(k==='qtext')q.text=t.value;
  else if(k==='qmult')q.mult=+t.value;
  else if(k==='at')q.answers[+t.dataset.k].t=t.value;
  else if(k==='ap'){q.answers[+t.dataset.k].p=Math.max(0,Math.min(999,Math.round(+t.value||0)))}
  const tot=q.answers.reduce((a,x)=>a+(+x.p||0),0),el=document.getElementById('tot');
  if(el)el.textContent=etxt(q,tot);
  touch();
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(IS_DISPLAY){if(e.code==='KeyF')toggleFs();return}
  const tag=((e.target&&e.target.tagName)||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(view!=='host'&&view!=='display')return;
  const m=/^(?:Digit|Numpad)([1-8])$/.exec(e.code);
  if(m){commit(s=>ACT.reveal(s,+m[1]-1));return}
  if(e.code==='KeyX')commit(ACT.wrong);
  else if(e.code==='KeyZ')undo();
  else if(e.code==='KeyF'&&view==='display')toggleFs();
  else if(e.code==='Escape'&&view==='display'){view='host';render()}
});
window.addEventListener('hashchange',()=>{if(location.hash==='#display')location.reload()});
render();
</script>

</body>
</html>
